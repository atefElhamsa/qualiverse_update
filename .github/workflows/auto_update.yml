name: Auto Update Build (Dev)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Get version from pubspec
        id: get_version
        shell: pwsh
        run: |
          $pubspec = Get-Content "pubspec.yaml" -Raw
          $fullVersion = [regex]::Match($pubspec, 'version:\s+(\S+)').Groups[1].Value
          $version = ($fullVersion -split '\+')[0]
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer and Zip
        shell: pwsh
        run: |
          if (Test-Path "build/windows/x64/runner/Release") {
            # 1. عمل ملف Zip للعملاء القدامى
            cd build/windows/x64/runner/Release
            tar -a -c -f ../../../../../build/qualiverse_release.zip *
            Write-Host "Release zipped using tar ✅"
            cd ../../../../..

            # 2. تعديل رقم الإصدار في ملف الانستولر
            $issPath = "windows/runner/installer.iss"
            $issContent = Get-Content $issPath
            $issContent = $issContent -replace 'AppVersion=.*', "AppVersion=${{ steps.get_version.outputs.version }}"
            Set-Content -Path $issPath -Value $issContent

            # 3. تشغيل Inno Setup للعملاء الجدد
            iscc "windows/runner/installer.iss" /O"build"

            Write-Host "Installer created successfully ✅"
          } else {
            Write-Error "Release folder not found ❌"
            exit 1
          }

      - name: Prepare Git
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://$env:GH_PAT@github.com/atefElhamsa/qualiverse_update.git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Create version tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.get_version.outputs.version }}"
          # امسح التاج لو موجود محلياً أو بعيداً وارفعه من جديد
          git tag -f $tag
          git push origin refs/tags/$tag --force
        env:
          GH_PAT: ${{ secrets.GH_PAT }}


      - name: Create / Update Release
        uses: softprops/action-gh-release@v1
        with:
          repository: atefElhamsa/qualiverse_update
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          prerelease: false
          files: |
            build/qualiverse_setup.exe
            build/qualiverse_release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Update version.json on main
        shell: pwsh
        run: |
          $repo = "https://$env:GH_PAT@github.com/atefElhamsa/qualiverse_update.git"
          $folder = "updater_temp"

          git clone $repo $folder
          cd $folder
          git checkout main
          git pull origin main --rebase

          # اسحب الـ version من pubspec.yaml أوتوماتيك
          $version = "${{ steps.get_version.outputs.version }}"

          # حدّث الـ JSON للعملاء القدامى (يجب أن يبقى zip لتجنب تعطل الكود القديم عندهم)
          $json = Get-Content version.json | ConvertFrom-Json
          $json.version = $version
          $json.url = "https://github.com/atefElhamsa/qualiverse_update/releases/download/v$version/qualiverse_release.zip"
          $json | ConvertTo-Json -Depth 10 | Set-Content version.json

          # إنشاء ملف appcast.xml لـ auto_updater
          $date = Get-Date -Format "r"
          $xml = "<?xml version=`"1.0`" encoding=`"utf-8`"?>`n" +
                 "<rss version=`"2.0`" xmlns:sparkle=`"http://www.andymatuschak.org/xml-namespaces/sparkle`">`n" +
                 "    <channel>`n" +
                 "        <title>QualiVerse</title>`n" +
                 "        <item>`n" +
                 "            <title>Version $version</title>`n" +
                 "            <description>New update is available.</description>`n" +
                 "            <pubDate>$date</pubDate>`n" +
                 "            <enclosure url=`"https://github.com/atefElhamsa/qualiverse_update/releases/download/v$version/qualiverse_setup.exe`"`n" +
                 "                       sparkle:version=`"$version`"`n" +
                 "                       sparkle:os=`"windows`"`n" +
                 "                       type=`"application/octet-stream`" />`n" +
                 "        </item>`n" +
                 "    </channel>`n" +
                 "</rss>"
          $xml | Set-Content appcast.xml -Encoding UTF8

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json appcast.xml
          git commit -m "chore: update version to $version" || Write-Host "No changes"
          git push origin main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

name: Auto Update Build (Dev)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Get version from pubspec
        id: get_version
        shell: pwsh
        run: |
          $pubspec = Get-Content "pubspec.yaml" -Raw
          $fullVersion = [regex]::Match($pubspec, 'version:\s+(\S+)').Groups[1].Value
          $version = ($fullVersion -split '\+')[0]
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Zip Release
        shell: pwsh
        run: |
          if (Test-Path "build/windows/x64/runner/Release") {
            cd build/windows/x64/runner/Release
            tar -a -c -f ../../../../../build/qualiverse_release.zip *
            Write-Host "Release zipped using tar ✅"
          } else {
            Write-Error "Release folder not found ❌"
            exit 1
          }

      - name: Prepare Git
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://$env:GH_PAT@github.com/atefElhamsa/qualiverse_update.git
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Create version tag
        shell: pwsh
        run: |
          $tag = "v${{ steps.get_version.outputs.version }}"
          git tag $tag
          git push origin refs/tags/$tag
        env:
          GH_PAT: ${{ secrets.GH_PAT }}


      - name: Create / Update Release
        uses: softprops/action-gh-release@v1
        with:
          repository: atefElhamsa/qualiverse_update
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          prerelease: false
          files: build/qualiverse_release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Update version.json on main
        shell: pwsh
        run: |
          $repo = "https://$env:GH_PAT@github.com/atefElhamsa/qualiverse_update.git"
          $folder = "updater_temp"

          git clone $repo $folder
          cd $folder
          git checkout main
          git pull origin main --rebase

          # اسحب الـ version من pubspec.yaml أوتوماتيك
          $version = "${{ steps.get_version.outputs.version }}"

          # حدّث الـ JSON كامل
          $json = Get-Content version.json | ConvertFrom-Json
          $json.version = $version
          $json.url = "https://github.com/atefElhamsa/qualiverse_update/releases/download/v$version/qualiverse_release.zip"

          $json | ConvertTo-Json -Depth 10 | Set-Content version.json

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git commit -m "chore: update version to $version" || Write-Host "No changes"
          git push origin main
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
